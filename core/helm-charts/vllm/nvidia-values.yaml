# NVIDIA GPU configuration
accelDevice: "nvidia"
gpuCount: 1

# Base model settings (similar structure to Gaudi/Xeon)
block_size: 128
max_num_seqs: 256
max_seq_len_to_capture: 2048
d_type: "bfloat16"
max_model_len: 8192

image:
  repository: vllm/vllm-openai
  tag: "v0.6.3"
  pullPolicy: IfNotPresent

runtime: "nvidia"
VLLM_NO_USAGE_STATS: 1
DO_NOT_TRACK: 1

# Optional scheduling overrides for NVIDIA nodes
nodeSelector: {}
tolerations: []
affinity: {}

# Model-specific overrides
modelConfigs:
  "meta-llama/Llama-3.1-8B-Instruct":
    configMapValues:
      HF_HUB_DISABLE_XET: 1
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
      VLLM_DECODE_BLOCK_BUCKET_STEP: 256
      VLLM_DECODE_BS_BUCKET_STEP: 32
      VLLM_PROMPT_BS_BUCKET_STEP: 32
      VLLM_PROMPT_SEQ_BUCKET_STEP: 256
    extraCmdArgs:
      [
        "--block-size",
        "128",
        "--dtype",
        "bfloat16",
        "--max-model-len",
        "8192",
        "--enable-chunked-prefill",
        "--disable-log-requests",
        "--tool-call-parser",
        "llama3_json",
      ]
    tensor_parallel_size: "1"

  "meta-llama/Llama-3.2-3B-Instruct":
    configMapValues:
      HF_HUB_DISABLE_XET: 1
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
      VLLM_DECODE_BLOCK_BUCKET_STEP: 256
      VLLM_DECODE_BS_BUCKET_STEP: 32
      VLLM_PROMPT_BS_BUCKET_STEP: 32
      VLLM_PROMPT_SEQ_BUCKET_STEP: 256
    extraCmdArgs:
      [
        "--block-size",
        "128",
        "--dtype",
        "bfloat16",
        "--max-model-len",
        "8192",
        "--enable-chunked-prefill",
        "--disable-log-requests",
        "--tool-call-parser",
        "llama3_json",
      ]
    tensor_parallel_size: "1"

defaultModelConfigs:
  configMapValues:
    HF_HUB_DISABLE_XET: 1
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  extraCmdArgs:
    [
      "--block-size",
      "128",
      "--dtype",
      "bfloat16",
      "--max-model-len",
      "8192",
      "--disable-log-requests",
    ]
  tensor_parallel_size: "1"
